<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALI-KHALIL</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#030803;color:#00ff66;
 font-family:monospace;padding:15px
}
header{
 text-align:center;border:1px solid #00ff66;
 padding:20px;border-radius:12px;
 box-shadow:0 0 15px #00ff6644
}
h1{letter-spacing:4px;text-shadow:0 0 12px #00ff66}
.status{color:#8affad;font-size:12px}
.grid{
 display:grid;grid-template-columns:1fr 1fr;
 gap:12px;margin-top:20px
}
.card{
 background:#071207;border:1px solid #087b37;
 padding:17px 10px;border-radius:10px;
 text-align:center;cursor:pointer
}
.card:active{background:#12351b}
.card b{display:block;margin-top:9px}
#output{
 margin-top:18px;padding:15px;
 border:1px solid #087b37;border-radius:10px;
 min-height:150px;white-space:pre-wrap;
 overflow-wrap:anywhere
}
button,input{
 background:#001a08;color:#00ff66;
 border:1px solid #00ff66;padding:11px;
 border-radius:6px;width:100%;margin-top:8px
}
footer{text-align:center;margin-top:25px;color:#477b57}
 .card{position:relative;overflow:hidden;box-shadow:0 0 8px #00ff6622;transition:.25s}.card:active{transform:scale(.96);box-shadow:0 0 22px #00ff66;border-color:#00ff66}header{animation:glow 3s infinite alternate}@keyframes glow{from{box-shadow:0 0 8px #00ff6633}to{box-shadow:0 0 25px #00ff6688}}button:active{box-shadow:0 0 15px #00ff66}body>*:not(#matrix-bg){position:relative;z-index:1}</style>
<style>@keyframes hackerType{from{width:0}to{width:100%}}header:after{content:root;content:"root@ALI-KHALIL:~# SYSTEM INITIALIZING...";display:block;overflow:hidden;white-space:nowrap;max-width:100%;margin:15px auto 0;direction:ltr;color:#00ff66;border-right:2px solid #00ff66;animation:hackerType 5s steps(40) infinite alternate}</style></head>
<body>

<header>
<h1>ALI-KHALIL</h1>
<div>CYBER SECURITY TERMINAL</div>
<p class="status">● SYSTEM ONLINE</p>
</header>

<div class="grid">
<div class="card" onclick="networkStatus()">📡<b>NETWORK STATUS</b></div>
<div class="card" onclick="device()">
📱<b>معلومات الجهاز</b>
</div>
<div class="card" onclick="urlCheck()">
🌐<b>تحليل الروابط</b>
</div>
<div class="card" onclick="password()">
🔐<b>قوة كلمة المرور</b>
</div>
<div class="card" onclick="matrix()">
💻<b>MATRIX</b>
</div>
<div class="card" onclick="webPentest()">
🔎<b>WEB PENTESTING</b>
</div>
<div class="card" onclick="about()">
🛡️<b>حول التطبيق</b>
</div>
<div class="card" onclick="clearOutput()">
🧹<b>مسح الشاشة</b>
</div>
</div>

<div id="output">ALI-KHALIL TERMINAL
MATRIX SYSTEM ACTIVE
جاهز لاستقبال الأوامر...
</div>

<footer>ALI-KHALIL © 2026</footer>

<script>
const out=document.getElementById('output');

function show(text){
 out.textContent=text;
}

function device(){
 show(
 'DEVICE INFORMATION\n\n'+
 'Platform: '+navigator.platform+
 '\nLanguage: '+navigator.language+
 '\nScreen: '+screen.width+' x '+screen.height+
 '\nBrowser: '+navigator.userAgent
 );
}

function urlCheck(){
 const value=prompt('أدخل الرابط المراد تحليله:');
 if(!value)return;
 try{
  const u=new URL(value);
  let result='URL ANALYSIS\n\n';
  result+='Protocol: '+u.protocol+'\n';
  result+='Domain: '+u.hostname+'\n';
  result+='HTTPS: '+(u.protocol==='https:'?'YES':'NO')+'\n';
  result+='Credentials: '+(u.username||u.password?'WARNING':'NONE');
  show(result);
 }catch(e){
  show('ERROR: رابط غير صالح');
 }
}

function password(){
 const p=prompt('أدخل كلمة تجريبية لتحليل قوتها:');
 if(p===null)return;
 let score=0;
 if(p.length>=12)score++;
 if(/[A-Z]/.test(p))score++;
 if(/[a-z]/.test(p))score++;
 if(/[0-9]/.test(p))score++;
 if(/[^A-Za-z0-9]/.test(p))score++;
 show('PASSWORD ANALYSIS\n\nScore: '+score+'/5\n'+
 (score>=4?'Strong':score>=2?'Medium':'Weak')+
 '\nملاحظة: لا تدخل كلمة مرورك الحقيقية.');
}

function matrix(){
 let chars='01ABCDEF';
 let result='MATRIX TERMINAL\n\n';
 for(let i=0;i<18;i++){
  for(let j=0;j<30;j++)
   result+=chars[Math.floor(Math.random()*chars.length)];
  result+='\n';
 }
 show(result);
}
async function webPentest(){
  const target = prompt("أدخل رابط موقع تملكه أو لديك تصريح بفحصه:");
  if(!target) return;

  let url;

  try {
    url = new URL(target.trim());

    if(!["http:", "https:"].includes(url.protocol)){
      show("ERROR: Protocol not supported");
      return;
    }

    if(url.username || url.password){
      show("WARNING: الرابط يحتوي على بيانات دخول.");
      return;
    }
  } catch {
    show("ERROR: رابط غير صالح");
    return;
  }

  let report = "ALI-KHALIL WEB SECURITY REPORT\n";
  report += "-------------------------\n";
  report += "DOMAIN: " + url.hostname + "\n";
  report += "PROTOCOL: " + url.protocol + "\n";
  report += "HTTPS: " + (url.protocol === "https:" ? "YES" : "NO") + "\n";
  report += "\nSECURITY HEADERS\n";

  show(report + "\nجاري الفحص...");

  try {
    const response = await fetch(url.href, {
      method: "GET",
      mode: "cors",
      credentials: "omit"
    });

    report += "\nHTTP STATUS: " + response.status + "\n";

    const headers = [
      "content-security-policy",
      "strict-transport-security",
      "x-content-type-options",
      "x-frame-options",
      "referrer-policy"
    ];

    for(const name of headers){
      const value = response.headers.get(name);
      report += "\n" + name + ": " +
        (value ? "PRESENT" : "NOT VISIBLE");
    }
  } catch {
    report += "\nتعذرت قراءة الترويسات.";
    report += "\nقد تكون قيود CORS هي السبب.";
  }

  report += "\n\nEND OF PASSIVE CHECK";
  report += "\nالنتائج ليست إثباتاً شاملاً لأمان الموقع.";
  show(report);
}

function about(){
 show('ALI-KHALIL\nCyber Security Tools\nVersion 1.0\nDeveloper: ALI');
}

function clearOutput(){
 show('TERMINAL CLEARED\nSYSTEM ONLINE');
}
</script>
<script src="js/tools/network.js"></script>
<script src="js/tools/port-scanner.js"></script>
<script src="js/tools/device.js"></script>
<canvas id="matrix-bg" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.13;z-index:0"></canvas><script>const c=document.getElementById("matrix-bg"),x=c.getContext("2d");let w,h,cols,y=[];function fit(){w=c.width=innerWidth;h=c.height=innerHeight;cols=Math.floor(w/16);y=Array(cols).fill(1)}fit();onresize=fit;setInterval(()=>{x.fillStyle="rgba(0,0,0,.08)";x.fillRect(0,0,w,h);x.fillStyle="#00ff66";x.font="14px monospace";y.forEach((v,i)=>{x.fillText(Math.random().toString(36).slice(2,3),i*16,v*16);if(v*16>h&&Math.random()>.975)y[i]=0;y[i]++})},55)</script></body>
